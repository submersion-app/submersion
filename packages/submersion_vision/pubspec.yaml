name: submersion_vision
description: On-device marine life detection and embedding for Submersion. Core ML on iOS and macOS.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SubmersionVisionPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: SubmersionVisionPlugin
        sharedDarwinSource: true
