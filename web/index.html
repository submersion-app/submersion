<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Submersion, the open-source dive log, in your browser: your dives, sites, gear and statistics from your own sync store.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Submersion">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Submersion</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Flutter's engine builds an Intl.Locale from every entry in
    // navigator.languages while it starts, before the app's own code runs, and
    // stops on the first one that is not a language tag. Chromium and Firefox
    // on Linux report "C" when LANG is C.UTF-8 (minimal desktops, containers,
    // CI runners), which left a blank page. Keep only the entries Intl
    // accepts; with none left, fall back to the engine's own default.
    (function () {
      try {
        var reported = Array.prototype.slice.call(navigator.languages || []);
        var valid = reported.filter(function (tag) {
          try {
            new Intl.Locale(tag);
            return true;
          } catch (error) {
            return false;
          }
        });
        if (valid.length === reported.length) return;
        if (valid.length === 0) valid = ['en-US'];
        Object.defineProperty(navigator, 'languages', {
          configurable: true,
          get: function () { return valid.slice(); }
        });
        Object.defineProperty(navigator, 'language', {
          configurable: true,
          get: function () { return valid[0]; }
        });
      } catch (error) {
        // A browser without Intl.Locale is one the engine cannot start in
        // either; leave navigator as it is.
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
