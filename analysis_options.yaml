# Analysis options for Submersion
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "packages/libdivecomputer_plugin/pigeons/**"
    # A package of its own (ffigen needs code_assets 2; the app is on 1),
    # resolved only when its bindings are regenerated.
    - "packages/submersion_vision/tool/ffigen/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - avoid_print
    - require_trailing_commas
    - always_use_package_imports
