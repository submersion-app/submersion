name: Dependabot failure alert

# Dependabot runs in a workflow GitHub generates (Dependabot Updates), and a
# failed run there notifies nobody. The bundler updates for ios/ and macos/
# failed every month from at least July 2026, security updates included, and
# were only found by reading the Actions list (#2766). This job checks the
# recent runs once a day, opens one rolling issue when an update stream's
# newest run failed, comments on it for each new failure, and closes it once
# every stream is green again; scripts/dependabot_failure_alert.py has the
# details.
#
# A schedule, not a workflow_run trigger on Dependabot Updates: that workflow
# is generated by GitHub, and an alert that might never fire would repeat the
# bug it is here to fix. The cron runs after Dependabot's own morning runs.
#
# If this job itself fails (an unreadable runs listing, say), GitHub emails
# whoever last changed the cron line, so a broken alert is not silent either.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, so a dispatch overlapping the cron cannot open a second
# rolling issue or close one the other is commenting on. Unlike beta.yml, a
# pending run the group replaces loses nothing: every run reads the live runs
# list and issue state, so the run that does go ahead sees the same failures.
concurrency:
  group: dependabot-failure-alert
  cancel-in-progress: false

jobs:
  alert:
    name: Alert on failed Dependabot runs
    # A fork with Actions enabled has no Dependabot history of its own to
    # report, and must not open issues or page the maintainer.
    if: github.repository == 'submersion-app/submersion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      # Lists the Dependabot Updates runs.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Open, update or close the Dependabot failure alert
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDABOT_ALERT_ASSIGNEE: ${{ vars.DEPENDABOT_ALERT_ASSIGNEE }}
        run: python3 scripts/dependabot_failure_alert.py
