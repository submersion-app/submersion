# Vision Merge Check
#
# Builds the marine life vision pipeline (packages/submersion_vision) into a
# small check program and runs the cases of boxes_test.py, from the species
# pack repository (submersion-app/species-pack), against its merge of two
# detectors' boxes (issue #4691). A pack's measured bars hold only while the
# app merges exactly as the scorer measured; the Linux test jobs cannot
# compile Core ML code, so this runs on macOS. The species pack repository
# runs the same check against this repository's main branch (issue #4769).

name: Vision Merge Check

on:
  push:
    branches: [main]
    paths:
      - 'packages/submersion_vision/darwin/**'
      - '.github/workflows/vision-merge-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/submersion_vision/darwin/**'
      - '.github/workflows/vision-merge-check.yml'

permissions:
  contents: read

concurrency:
  group: vision-merge-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-check:
    name: Vision Merge Check
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            packages/submersion_vision/darwin

      - uses: actions/checkout@v7
        with:
          repository: submersion-app/species-pack
          path: species-pack

      - name: Check the pipeline's merge against boxes.py's cases
        env:
          SUBMERSION_APP: ${{ github.workspace }}
        run: species-pack/vision_cli/check_merge.sh "$RUNNER_TEMP/merge_check"
