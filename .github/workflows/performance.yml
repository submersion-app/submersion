# Performance Benchmarks
#
# Runs performance-tagged tests on demand to detect regressions.
#
# The weekly schedule is paused. Every scheduled run from 2026-08-17 to
# 2026-09-21 was cancelled at the 30-minute timeout before the tests
# finished. The tests alone did not fit even when code generation took
# 4 minutes, and code generation has since grown to about 17 minutes on the
# macos-26 runner (issue #2453). Restore the schedule once a run fits in its
# timeout.

name: Performance Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance
  cancel-in-progress: true

env:
  FLUTTER_VERSION_FILE: '.github/flutter-version.txt'

jobs:
  benchmark:
    name: Run Performance Tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat ${{ env.FLUTTER_VERSION_FILE }})" >> "$GITHUB_OUTPUT"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        id: setup-flutter
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run performance tests
        run: flutter test --tags performance

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-${{ github.run_number }}
          path: |
            test/performance/results/
          retention-days: 90
          if-no-files-found: ignore
