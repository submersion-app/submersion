  build-macos:
    name: Build macOS
    needs: codegen
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat ${{ env.FLUTTER_VERSION_FILE }})" >> "$GITHUB_OUTPUT"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: subosito/flutter-action@v2
        id: setup-flutter
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: 'stable'

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-flutter.outputs.CACHE-PATH }}
          key: ${{ steps.setup-flutter.outputs.CACHE-KEY }}

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            macos/Pods
            ~/.cocoapods
          key: pods-macos-${{ runner.os }}-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: |
            pods-macos-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Disable Swift Package Manager (project uses CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Download generated code
        uses: actions/download-artifact@v8
        with:
          name: generated-code

      - name: Unpack generated code
        run: tar -xzf generated-code.tar.gz

      - name: Update CocoaPods repo
        run: pod repo update

      - name: Clean native asset build state
        run: |
          rm -rf build/native_assets
          rm -rf .dart_tool/flutter_build

      - name: Build macOS (no-sandbox for distribution)
        run: |
          # Configure ad-hoc signing for CI (no developer certificate available)
          # Must modify project.pbxproj directly - xcconfig can't override target-level settings
          sed -i '' \
            -e 's/CODE_SIGN_IDENTITY = ".*"/CODE_SIGN_IDENTITY = "-"/g' \
            -e 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' \
            -e 's/PROVISIONING_PROFILE_SPECIFIER = ".*"/PROVISIONING_PROFILE_SPECIFIER = ""/g' \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = ".*"/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-"/g' \
            macos/Runner.xcodeproj/project.pbxproj

          # Build with Flutter
          flutter build macos --release "${{ env.DART_DEFINES }}" "--dart-define=GOOGLE_DRIVE_CLIENT_SECRET=${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}"

          # Re-sign with ad-hoc signature and no-sandbox entitlements
          codesign --force --deep --sign - \
            --entitlements macos/Runner/ReleaseNoSandbox.entitlements \
            build/macos/Build/Products/Release/submersion.app

      # gen_snapshot emits App.framework's exported symbols in address order, which
      # macOS 11's dyld cannot resolve by binary search -- the app then segfaults on
      # launch before its window appears (issue #996). A build phase sorts them; this
      # asserts the phase actually ran, since the failure is invisible on macOS 12+.
      - name: Verify App.framework symbol order
        run: |
          python3 scripts/fix_macho_symbol_order.py --check \
            build/macos/Build/Products/Release/submersion.app/Contents/Frameworks/App.framework/Versions/A/App

      # Zip with ditto before upload: upload-artifact would otherwise root the
      # archive inside the .app bundle (losing the submersion.app wrapper) and
      # strip the symlinks, permission bits, and codesign seal the bundle
      # needs to be runnable.
      - name: Zip macOS app bundle
        if: >
          github.event_name == 'pull_request' ||
          (github.ref == 'refs/heads/main' && github.event_name == 'push')
        run: |
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/submersion.app \
            build/macos/Build/Products/Release/submersion-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        if: >
          github.event_name == 'pull_request' ||
          (github.ref == 'refs/heads/main' && github.event_name == 'push')
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/submersion-macos.zip
          retention-days: 7

  build-android:
    name: Build Android
    needs: codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat ${{ env.FLUTTER_VERSION_FILE }})" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        id: setup-flutter
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: 'stable'

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-flutter.outputs.CACHE-PATH }}
          key: ${{ steps.setup-flutter.outputs.CACHE-KEY }}

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # flutter_secure_storage 11 hardcodes compileSdk 37 in its own module,
      # so the app compiles against 37 too (android/app/build.gradle.kts).
      # Installed explicitly rather than left to Gradle's auto-download: the
      # runner image only preinstalls a few platforms, and a missing one fails
      # late with an opaque "failed to find target with hash string" error.
      - name: Install Android SDK platform 37
        run: |
          # sdkmanager is not on PATH on the runner image; it lives under
          # $ANDROID_HOME/cmdline-tools/<version>/bin. Located rather than
          # hardcoded so a runner-image reshuffle fails loudly here instead
          # of surfacing later as a confusing Gradle error.
          sdkmanager="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" \
            -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$sdkmanager" ]; then
            echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          echo "Using $sdkmanager"
          "$sdkmanager" --install "platforms;android-37.0" < /dev/null

      - name: Disable Swift Package Manager (project uses CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Download generated code
        uses: actions/download-artifact@v8
        with:
          name: generated-code

      - name: Unpack generated code
        run: tar -xzf generated-code.tar.gz

      - name: Build Android APK
        run: flutter build apk --release "${{ env.DART_DEFINES }}" -v

      # The plugin's Kotlin JVM tests (BondPolicy, BondDiagnostics,
      # BleScanDiagnostics, SerialReadBuffer) cover decision logic that no
      # Dart test can reach. They run here rather than in their own job
      # because android/gradlew is gitignored: the Gradle wrapper only
      # exists once a Flutter Android build has injected it, which the APK
      # step above has just done.
      - name: Run libdivecomputer_plugin Kotlin unit tests
        working-directory: android
        run: ./gradlew :libdivecomputer_plugin:testDebugUnitTest

      # Guards against issue #318: a 4 KB-aligned native lib (liblibdc_jni.so)
      # silently shipped and crashed the app on Android 15+ 16 KB-page devices.
      # Fails the build if any 64-bit native library is not 16 KB-aligned.
      - name: Verify 16 KB native library alignment
        run: python3 scripts/check_16kb_alignment.py build/app/outputs/flutter-apk/app-release.apk

      # Guards against issue #433: a dependency bump (sqlite3_flutter_libs ->
      # 0.6.0+eol, an empty tombstone release) silently dropped libsqlite3.so
      # from the APK, so the app could not open its database on launch. The
      # alignment guard above does not catch this -- a missing lib is not a
      # misaligned one. Fails the build if a required native library is absent.
      - name: Verify required native libraries are bundled
        run: python3 scripts/check_native_libs_present.py build/app/outputs/flutter-apk/app-release.apk

      # Guards against the second half of issue #318: R8 release minification
      # renamed the reflectively-probed usb-serial-for-android driver methods
      # (e.g. getSupportedDevices), so every serial-USB download crashed with a
      # NoSuchMethodException. Fails the build if a driver method was obfuscated.
      - name: Verify serial driver ProGuard keep rules
        run: python3 scripts/check_proguard_serial_keep.py build/app/outputs/mapping/release/mapping.txt

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        if: >
          github.event_name == 'pull_request' ||
          (github.ref == 'refs/heads/main' && github.event_name == 'push')
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build-linux:
    name: Build Linux
    needs: codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat ${{ env.FLUTTER_VERSION_FILE }})" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        id: setup-flutter
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: 'stable'

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-flutter.outputs.CACHE-PATH }}
          key: ${{ steps.setup-flutter.outputs.CACHE-KEY }}

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # libssl-dev is required by sqlcipher_flutter_libs: the Linux build
      # compiles SQLCipher from source and links it against OpenSSL. The
      # hosted runner image happens to ship the headers today, so declaring
      # it keeps a future image change from silently breaking the build.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libsecret-1-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev

      - name: Disable Swift Package Manager (project uses CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Download generated code
        uses: actions/download-artifact@v8
        with:
          name: generated-code

      - name: Unpack generated code
        run: tar -xzf generated-code.tar.gz

      - name: Build Linux
        run: flutter build linux --release "${{ env.DART_DEFINES }}" "--dart-define=GOOGLE_DRIVE_CLIENT_SECRET=${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}" -v

      - name: Check bundled native assets
        # Same guard as the Windows job. Linux uses the stock Flutter install
        # rule and has always bundled its libraries, so this doubles as the
        # positive control that the check is not vacuously passing.
        run: python3 scripts/check_bundled_native_assets.py build/linux/x64/release/bundle

      # Packaging runs here as well as in build-all.yml because build-all.yml
      # is workflow_call-only: nothing a pull request triggers ever invokes it,
      # so without this the packaging path would be unverifiable until after a
      # merge, when a break already blocks the beta pipeline. Both workflows
      # call the same scripts, so they cannot drift.
      #
      # This job runs on ubuntu-latest, not the ubuntu:22.04 container
      # build-all.yml uses, so it covers packaging mechanics and dependency
      # resolution but NOT the glibc floor. build-all.yml remains the only
      # check on the floor itself.
      - name: Install packaging tools
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential rpm python3-pil binutils
          sudo gem install --no-document fpm

      - name: Build .deb and .rpm
        run: |
          set -euo pipefail
          mkdir -p packages
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+/./')
          scripts/release/build_linux_packages.sh \
            --bundle build/linux/x64/release/bundle \
            --version "$VERSION" \
            --deb "packages/Submersion-ci-Linux-amd64.deb" \
            --rpm "packages/Submersion-ci-Linux-x86_64.rpm"

      # The .deb is verified against the runner's own Ubuntu release rather
      # than an older distro. This job builds on ubuntu-latest, so its binary
      # requires that runner's glibc, and installing it on debian:12
      # (glibc 2.36) fails with "GLIBC_2.38 not found" no matter how correct
      # the packaging is. build-all.yml builds on ubuntu-latest too, so no
      # job proves installation on older distros: none is supported.
      #
      # The tag is derived from the runner rather than pinned, so this keeps
      # matching when GitHub moves ubuntu-latest to the next release.
      - name: Verify the packages install in clean containers
        run: |
          set -euo pipefail
          UBUNTU_TAG="ubuntu:$(. /etc/os-release && echo "$VERSION_ID")"
          echo "runner is $UBUNTU_TAG"
          # Every image runs even when an earlier one fails, so one run says
          # whether the .deb, the .rpm, or both are broken. Testing the exit
          # status with `if !` keeps the failure from tripping `set -e`.
          failed=()
          for image in "$UBUNTU_TAG" fedora:latest; do
            echo "=== $image ==="
            if ! docker run --rm \
              -v "$PWD/packages:/p" \
              -v "$PWD/scripts/release/verify_linux_package.sh:/verify.sh:ro" \
              "$image" bash /verify.sh; then
              failed+=("$image")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::package verification failed on: ${failed[*]}"
            exit 1
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        if: >
          github.event_name == 'pull_request' ||
          (github.ref == 'refs/heads/main' && github.event_name == 'push')
        with:
          name: linux-build
          path: build/linux/x64/release/bundle
          retention-days: 7

  build-windows:
    name: Build Windows
    needs: codegen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read Flutter version
        id: flutter-ver
        # Windows runners default to PowerShell, where the bash-style
        # $(...) command substitution and $GITHUB_OUTPUT do not work. Without
        # this the version output is empty and subosito installs the latest
        # stable Flutter instead of the pinned version. See flutter-version.txt.
        shell: bash
        run: echo "version=$(cat ${{ env.FLUTTER_VERSION_FILE }})" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        id: setup-flutter
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: 'stable'

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-flutter.outputs.CACHE-PATH }}
          key: ${{ steps.setup-flutter.outputs.CACHE-KEY }}

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~\.pub-cache
            ${{ github.workspace }}\.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            C:\Users\runneradmin\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Disable Swift Package Manager (project uses CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Download generated code
        uses: actions/download-artifact@v8
        with:
          name: generated-code

      - name: Unpack generated code
        run: tar -xzf generated-code.tar.gz

      - name: Build Windows
        run: flutter build windows --release "${{ env.DART_DEFINES }}" "--dart-define=GOOGLE_DRIVE_CLIENT_SECRET=${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}" -v

      - name: Check bundled native assets
        # A Windows build that never bundles sqlcipher.dll still compiles,
        # packages and ships; it only fails when a user launches it (issue
        # #1129). CI builds but never launches, so this is the step that has to
        # notice. Windows runners expose the interpreter as `python`, not the
        # `python3` the Linux guard steps use.
        run: python scripts/check_bundled_native_assets.py build\windows\x64\runner\Release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        if: >
          github.event_name == 'pull_request' ||
          (github.ref == 'refs/heads/main' && github.event_name == 'push')
        with:
          name: windows-build
          path: build\windows\x64\runner\Release
          retention-days: 7

  pr-number:
    name: Record PR number
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Write PR number to file
        run: echo "${{ github.event.number }}" > pr-number.txt
      - name: Upload PR number artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-number
          path: pr-number.txt
          retention-days: 1

  # Single aggregation gate. Because the build jobs now run in parallel with the
  # test shards (needs: codegen, not needs: test), a green build no longer
  # implies tests passed. This job is the one to mark "required" in branch
  # protection - it fails if ANY needed job failed or was cancelled. Skipped
  # jobs (e.g. integration-test on push) are treated as acceptable.
  # NOTE: codegen MUST be listed here - if it fails, every downstream job is
  # SKIPPED, and skipped is treated as acceptable below, so without codegen in
  # the needs list a codegen failure would report a false green.
  # `changes` is likewise listed: on a docs/CI-only change it reports code=false
  # and the whole pipeline SKIPS (an accepted green), but if the detector itself
  # FAILS we must not silently skip-then-green, so its failure must reach here.
  # A submodule pointer is a single sha with no file diff, so a pull request
  # that moves libdivecomputer backwards reverts every fork commit in between
  # while showing a reviewer nothing at all to look at. PR #342 sat with a
  # pointer that would have silently undone two shipped driver fixes. Nothing
  # else in the pipeline can catch this: the app still builds, and the reverted
  # commits are drivers no CI job exercises.
  #
  # The invariant is one-directional on purpose. The pointer may run AHEAD of
  # the fork's submersion-patches tip (a patch is pushed to the fork before the
  # app pull request that adopts it merges), and it may stand still. It may
  # never contain less than the base branch already contains.
  submodule-pointer:
    name: libdivecomputer pointer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: The libdivecomputer pointer must not go backwards
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          sub=packages/libdivecomputer_plugin/third_party/libdivecomputer
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          fi
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "Base commit unavailable ('$base'); nothing to compare against."
            exit 0
          fi

          base_link="$(git rev-parse --verify --quiet "${base}:${sub}" || true)"
          head_link="$(git rev-parse --verify "${head}:${sub}")"
          if [ -z "$base_link" ]; then
            echo "The submodule is new on this branch; nothing to compare against."
            exit 0
          fi
          if [ "$base_link" = "$head_link" ]; then
            echo "Pointer unchanged at $head_link."
            exit 0
          fi

          # The base pointer may be unreachable from the shallow submodule
          # clone, and either end may live on a branch this checkout never
          # fetched, so take the whole fork before deciding.
          git -C "$sub" fetch --quiet --tags origin '+refs/heads/*:refs/remotes/origin/*'

          for sha in "$base_link" "$head_link"; do
            if ! git -C "$sub" cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::libdivecomputer commit $sha is not reachable in $(git config -f .gitmodules submodule.${sub}.url). Push the branch it lives on before merging."
              exit 1
            fi
          done

          if git -C "$sub" merge-base --is-ancestor "$base_link" "$head_link"; then
            echo "Pointer moves forward: $base_link -> $head_link"
            exit 0
          fi

          echo "The libdivecomputer pointer moves to a commit that does not contain the base branch's."
          echo "Base: $base_link"
          echo "Head: $head_link"
          echo "These commits are on the base pointer and would be reverted:"
          git -C "$sub" log --oneline "${head_link}..${base_link}"
          echo "::error::libdivecomputer pointer would revert the commits listed above. Rebase the submodule branch onto the current submersion-patches tip and update the pointer."
          exit 1

  # Adding a job below WITHOUT adding it here makes it advisory: red on the PR,
  # ignored by the merge box. scripts/check_ci_success_gate.py fails the build
  # if that happens; exempt a genuinely non-gating job there, not by omission.
  ci-success:
    name: CI Success
    if: always()
    needs:
      - changes
      - codegen
      - analyze
      - test
      - timezone-tests
      - script-tests
      - integration-test
      - build-ios
      - build-macos
      - build-android
      - build-linux
      - build-windows
      - submodule-pointer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check CI aggregation gate
        # Deliberately duplicated from script-tests, which runs the same guard
        # for a faster signal. This copy is the enforcing one: a guard that
        # runs only inside a gated job cannot report its own de-gating, since
        # dropping that job from `needs` below would make its failure advisory
        # too. Running it here, in the one job branch protection requires,
        # closes that loop. Ordered before the results check so a de-gated
        # pipeline reports the cause rather than a downstream symptom.
        run: python3 scripts/check_ci_success_gate.py

      - name: Verify all required jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: $results"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A required job did not succeed (result=$r)"
              exit 1
            fi
          done
          echo "All required jobs passed."
