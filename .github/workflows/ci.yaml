name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION_FILE: '.github/flutter-version.txt'
  # OSM tile server acknowledgment (proves we've read the usage policy)
  # See: https://operations.osmfoundation.org/policies/tiles/
  DART_DEFINES: '--dart-define=flutter.flutter_map.unblockOSM=Our tile servers are not.'

jobs:
  # Cheap gate: does this push/PR touch anything that can change a Flutter
  # analyze/test/build outcome? Pure docs / CI-meta changes (markdown, images,
  # .github/ workflow edits, LICENSE, git-hooks, etc.) set code=false, which
  # lets codegen - and every job that hangs off it - skip. The ci-success gate
  # still runs and reports green because skipped jobs are acceptable there.
  # Bias is FAIL-SAFE: any path not explicitly recognized as inert, and any
  # inability to compute the diff, yields code=true (run the full pipeline).
  # Escape hatch: put [full-ci] in the PR title or a commit message to force the
  # full pipeline even for a docs/CI-only change (e.g. to validate a ci.yaml edit).
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect build/test-affecting changes
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          fi
          # Fail-safe: if the base commit is missing/unknown (first push, force
          # push, shallow clone), run the full pipeline rather than guess.
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "Base commit unavailable ('$base'); running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Two ranges with different semantics:
          #   diff_range - three-dot on PRs so `git diff` compares merge-base vs
          #     head (only the PR's own file changes); plain endpoint diff on push.
          #   log_range  - always two-dot (base..head) = ONLY the commits this
          #     push/PR adds. NOT three-dot: `git log base...head` is a symmetric
          #     difference that would also scan base-branch commits main gained
          #     since the branch forked, so a [full-ci] in an unrelated main
          #     commit could falsely force a full run.
          if [ "$EVENT" = "pull_request" ]; then
            diff_range="${base}...${head}"
          else
            diff_range="${base}..${head}"
          fi
          log_range="${base}..${head}"
          # Escape hatch: a [full-ci] marker in the PR title or any commit
          # message in log_range forces the full pipeline. Lets CI/meta-only
          # changes (e.g. editing this very workflow), which otherwise skip the
          # heavy jobs, opt in to exercising the whole DAG. Only ever forces
          # MORE work, so it cannot cause a false skip.
          if printf '%s\n%s' "$PR_TITLE" "$(git log --format=%B "$log_range")" \
               | grep -qiF '[full-ci]'; then
            echo "[full-ci] override found; running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$diff_range")"
          echo "Changed files:"
          printf '%s\n' "$files"
          # code=true unless EVERY changed file matches an inert pattern below.
          # NB: these are `case` globs, not filesystem globs - in `case`, `*`
          # matches `/` too, so `docs/*` and `.github/*` DO match nested paths
          # (docs/img/x.png, .github/workflows/ci.yaml). No globstar/`**` needed.
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              .github/flutter-version.txt) code=true ;;   # SDK bump affects all
              .github/*) ;;                                # other CI/meta: inert
              *.md|docs/*|LICENSE*|.gitignore|.gitattributes|.editorconfig|codecov.yml|hooks/*) ;;
              *.png|*.jpg|*.jpeg|*.gif|*.svg|*.webp|*.ico) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "Result: code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Producer job: runs build_runner ONCE and publishes the generated sources as
  # an artifact. Everything else (analyze, test, builds) gates on this ~3 min
  # job instead of the full analyze job, so flutter analyze + format run in
  # PARALLEL with the test shards and builds rather than as a serial prefix.
  # Gated on `changes`: when no build/test-affecting file changed, codegen skips
  # and the whole downstream DAG (analyze, test, builds) skips with it.
  codegen:
    name: Code Generation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat ${{ env.FLUTTER_VERSION_FILE }})" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        id: setup-flutter
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: 'stable'

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-flutter.outputs.CACHE-PATH }}
          key: ${{ steps.setup-flutter.outputs.CACHE-KEY }}

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Disable Swift Package Manager (project uses CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # Share the generated sources (Drift/json_serializable/riverpod/freezed
      # outputs) so downstream jobs can skip the ~3 min build_runner bootstrap.
      # All generated kinds (*.g.dart / *.freezed.dart / *.mocks.dart) are now
      # gitignored, so they all need to travel. We tar from the workspace root so
      # the lib/ and test/ path prefixes are preserved exactly (upload-artifact
      # would otherwise collapse paths to their least-common-ancestor dir).
      - name: Package generated code
        run: |
          mapfile -d '' files < <(find lib test -type f \( -name '*.g.dart' -o -name '*.freezed.dart' -o -name '*.mocks.dart' \) -print0)
          echo "Packaging ${#files[@]} generated files"
          if [ "${#files[@]}" -eq 0 ]; then echo "::error::no generated files to package"; exit 1; fi
          printf '%s\0' "${files[@]}" | tar --null -T - -czf generated-code.tar.gz

      - name: Upload generated code
        uses: actions/upload-artifact@v7
        with:
          name: generated-code
          path: generated-code.tar.gz
          if-no-files-found: error
          retention-days: 1

  analyze:
    name: Analyze & Format
    needs: codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat ${{ env.FLUTTER_VERSION_FILE }})" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        id: setup-flutter
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: 'stable'

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-flutter.outputs.CACHE-PATH }}
          key: ${{ steps.setup-flutter.outputs.CACHE-KEY }}

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Disable Swift Package Manager (project uses CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Download generated code
        uses: actions/download-artifact@v8
        with:
          name: generated-code

      - name: Unpack generated code
        run: tar -xzf generated-code.tar.gz

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      # lib/l10n/arb/app_localizations*.dart is produced by `flutter gen-l10n`
      # and is CHECKED IN, unlike the build_runner outputs (*.g.dart /
      # *.freezed.dart / *.mocks.dart), which are gitignored and rebuilt by the
      # codegen job above. Nothing else in the pipeline regenerates it, and
      # `flutter test` does not either despite `generate: true` in pubspec.yaml,
      # so what is committed is exactly what ships. Without this assertion an
      # ARB edit that skipped `flutter gen-l10n`, or a generated file that was
      # hand-edited or hand-resolved during a merge (these conflict often, since
      # every locale changes together), merges fully green and the app serves
      # the stale string. Only the handful of keys some test asserts by value
      # would catch it today, out of ~9800.
      #
      # Runs LAST so the analyze and format verdicts above are reported against
      # the tree as committed, not against a freshly regenerated copy.
      - name: Verify generated localizations match the ARB files
        run: |
          flutter gen-l10n
          # --porcelain rather than `git diff --exit-code` so a brand-new locale
          # whose generated file was never added shows up as untracked drift too.
          drift="$(git status --porcelain -- 'lib/l10n/arb/app_localizations*.dart')"
          if [ -n "$drift" ]; then
            echo "Generated localizations do not match the ARB files:"
            printf '%s\n' "$drift"
            git --no-pager diff -- 'lib/l10n/arb/app_localizations*.dart'
            echo "::error::lib/l10n/arb/app_localizations*.dart is out of date. Run 'flutter gen-l10n' and commit the result."
            exit 1
          fi
          echo "Generated localizations are up to date."

  test:
    name: Test (shard ${{ matrix.shard }})
    needs: codegen
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the other shards when one fails - we want the full picture.
      fail-fast: false
      matrix:
        # 0-based shard indices; keep TOTAL_SHARDS below in sync with the count.
        # NOTE: the shard count is coupled to codecov.yml `after_n_builds`, which
        # must equal (shard count + 1) for the scripts job -- Codecov holds the
        # patch/project status until every partial lcov arrives (see codecov.yml).
        # It is also bounded by the account-wide concurrent-job cap: this workflow
        # already fans out ~10-11 non-test jobs (analyze + 5 builds + scripts +
        # timezone + integration) that share the pool AND gate ci-success, so
        # oversharding queues the builds and makes total CI slower, not
        # faster. 8 keeps us under the cap while roughly halving test
        # wall-clock.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      TOTAL_SHARDS: 8
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat ${{ env.FLUTTER_VERSION_FILE }})" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        id: setup-flutter
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: 'stable'

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-flutter.outputs.CACHE-PATH }}
          key: ${{ steps.setup-flutter.outputs.CACHE-KEY }}

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Disable Swift Package Manager (project uses CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Download generated code
        uses: actions/download-artifact@v8
        with:
          name: generated-code

      - name: Unpack generated code
        run: tar -xzf generated-code.tar.gz

      - name: Run tests
        # flutter test's built-in --total-shards shards by test CASE, so every
        # shard still LOADS ~all test files and pays the dominant per-file cost
        # (isolate + Flutter binding + Drift setup, and ~3.6x amplified by
        # --coverage, which dumps the VM hit-map per suite). That barely divides
        # wall-clock. We instead shard by FILE so each job loads a disjoint
        # subset, which divides the per-file cost. Codecov merges the partial
        # coverage reports via the per-shard flag below.
        run: |
          total=$(find test -name '*_test.dart' | wc -l)
          # (NR-1) so the modulus is 0-based like matrix.shard: shard i owns
          # file indices i, i+N, i+2N, ... (shard 0 -> first file). Plain NR
          # (1-based) would map shard 0 to every Nth file and leave it empty
          # for suites smaller than N.
          mapfile -t files < <(find test -name '*_test.dart' | sort \
            | awk "(NR-1) % ${TOTAL_SHARDS} == ${{ matrix.shard }}")
          echo "Shard ${{ matrix.shard }}/${TOTAL_SHARDS}: ${#files[@]} of ${total} test files"
          # Guard: with no paths, `flutter test` runs the ENTIRE suite. An empty
          # shard (more shards than files) would silently re-run everything and
          # defeat sharding, so skip it and emit an empty lcov so the Codecov
          # step still has a file to upload.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No test files assigned to this shard; skipping."
            mkdir -p coverage && : > coverage/lcov.info
            exit 0
          fi
          flutter test --coverage --exclude-tags performance "${files[@]}"

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          # Per-shard flag so Codecov merges the partial reports for this commit.
          flags: shard-${{ matrix.shard }}
          fail_ci_if_error: false  # Enable after configuring repo on codecov.io

  # Replays the timezone-sensitive tests under a non-UTC zone. The runners are
  # UTC, where a device's UTC offset is zero and a whole class of frame bug
  # cannot reproduce: `dives.dive_date_time` holds a wall clock flagged as UTC
  # while the filter's dates are built LOCAL, so mixing the two frames shifts
  # the day boundary by exactly that offset and stays invisible here
  # (issue #1368).
  #
  # Two zones, because they fail differently: America/New_York is a whole hour
  # WEST of UTC (a boundary pulls dives out), Australia/Adelaide is a HALF hour
  # EAST (a boundary pulls extra dives in, and the half hour catches rounding a
  # whole-hour offset hides). Both observe DST, so a `Duration(days: 1)` added
  # to a local date lands 23 or 25 hours out at a transition.
  #
  # Scoped to a hand-maintained file list rather than the whole suite: an
  # unscoped `flutter test --tags ...` still compiles every test file, which is
  # the dominant cost. Add any new test whose result depends on the machine's
  # zone here.
  timezone-tests:
    name: Timezone Tests
    needs: codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat ${{ env.FLUTTER_VERSION_FILE }})" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        id: setup-flutter
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: 'stable'

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-flutter.outputs.CACHE-PATH }}
          key: ${{ steps.setup-flutter.outputs.CACHE-KEY }}

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Disable Swift Package Manager (project uses CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Download generated code
        uses: actions/download-artifact@v8
        with:
          name: generated-code

      - name: Unpack generated code
        run: tar -xzf generated-code.tar.gz

      - name: Run zone-sensitive tests under non-UTC zones
        run: |
          set -euo pipefail
          files=(
            test/features/dive_log/dive_filter_date_boundary_test.dart
            test/features/dive_log/domain/models/dive_filter_state_test.dart
            test/features/dive_log/data/repositories/dive_records_filter_test.dart
            test/features/dive_log/data/repositories/dive_repository_weekday_filter_test.dart
            test/features/statistics/data/dive_filter_sql_test.dart
          )
          # Guard against a rename silently emptying the list: with no paths,
          # `flutter test` would run the ENTIRE suite twice and look green.
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Listed test file is missing: $f"
              exit 1
            fi
          done
          for zone in America/New_York Australia/Adelaide; do
            echo "::group::TZ=$zone"
            TZ="$zone" flutter test "${files[@]}"
            echo "::endgroup::"
          done

  # Unit-tests the dependency-free Python guard scripts (e.g. the issue #318
  # ProGuard keep-rule checker). No Flutter/codegen needed, so it runs in
  # parallel and gives the guard logic its own coverage, scoped to the script.
  script-tests:
    name: Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install coverage.py
        # Retried: a single unreachable-index blip used to fail the whole job.
        # pip reports that as `(from versions: none)` -- an empty candidate
        # list, not a version conflict -- after silently exhausting its own
        # retries, e.g. run 33789978791.
        run: |
          for attempt in 1 2 3; do
            if python3 -m pip install coverage; then
              exit 0
            fi
            echo "::warning::pip install coverage failed (attempt $attempt/3)"
            # An `[ ... ] && sleep` one-liner would abort the step with no
            # message here: the step shell is `bash -e`, and on the last
            # attempt the false test makes the loop body's final command
            # return 1. See scripts/pre_push_hook_test.sh for the same bug.
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::pip install coverage failed after 3 attempts"
          exit 1

      - name: Check CI aggregation gate
        # Fails if a job is missing from ci-success.needs. Such a job shows red
        # on the PR while the required check stays green, which is how
        # script-tests itself went ungated from 2026-06-24 to 2026-09-03.
        run: python3 scripts/check_ci_success_gate.py

      - name: Check JNI local-reference hygiene (source)
        # Source-level guard: no build artifact needed (unlike the APK/mapping
        # guards), so it runs here. Fails if a libdivecomputer JNI callback
        # leaks a local ref -> local reference table overflow on a long download
        # (Mares Puck Pro) -> silent SIGABRT. See issue #318.
        run: python3 scripts/check_jni_local_refs.py

      - name: Check dive-download process isolation (manifest)
        # Fails if the serial download service loses android:process=":dc" -- a
        # native download crash would then kill the app again (issue #318).
        run: python3 scripts/check_dc_process_isolation.py

      - name: Run Python guard tests with coverage
        run: |
          mkdir -p coverage
          guards='scripts/check_proguard_serial_keep.py,scripts/check_native_libs_present.py,scripts/check_bundled_native_assets.py,scripts/check_jni_local_refs.py,scripts/check_dc_process_isolation.py,scripts/check_ci_success_gate.py,scripts/fix_macho_symbol_order.py,scripts/release/sanitize_apple_store_notes.py'
          python3 -m coverage run --include="$guards" \
            scripts/check_proguard_serial_keep_test.py
          python3 -m coverage run --append --include="$guards" \
            scripts/check_native_libs_present_test.py
          python3 -m coverage run --append --include="$guards" \
            scripts/check_bundled_native_assets_test.py
          python3 -m coverage run --append --include="$guards" \
            scripts/check_jni_local_refs_test.py
          python3 -m coverage run --append --include="$guards" \
            scripts/check_dc_process_isolation_test.py
          python3 -m coverage run --append --include="$guards" \
            scripts/check_ci_success_gate_test.py
          python3 -m coverage run --append --include="$guards" \
            scripts/fix_macho_symbol_order_test.py
          python3 -m coverage run --append --include="$guards" \
            scripts/release/sanitize_apple_store_notes_test.py
          python3 -m coverage report -m --include="$guards"
          python3 -m coverage xml --include="$guards" \
            -o coverage/scripts.xml

      - name: Run chamber directory pipeline tests
        # The harvester generates a safety-critical dataset: its validation
        # gates are what stop a broken parser shipping blank phone numbers or
        # duplicate ids. Kept out of the guards coverage set above so it does
        # not perturb that report; pypdf is installed here because the FFESSM
        # registry is a PDF (the test skips itself without it).
        run: |
          python3 -m pip install pypdf
          python3 scripts/chamber_harvester_test.py
          python3 scripts/chamber_sources_test.py

      - name: Run sea area table generator tests
        # The generator builds the offline body-of-water table. The runtime
        # resolver trusts it for closed rings and ascending area order, so a
        # regression here would name the wrong sea rather than fail loudly.
        # shapely is the generator's only dependency; without it the test
        # skips itself.
        run: |
          python3 -m pip install shapely
          python3 scripts/sea_area_harvester_test.py

      - name: Run appcast beta feed test
        run: ./scripts/generate_appcast_beta_test.sh

      - name: Run release notes HTML test
        run: ./scripts/generate_release_notes_html_test.sh

      - name: Run beta release notes test
        run: ./scripts/release/beta_release_notes_test.sh

      - name: Run changelog generator test
        run: ./scripts/release/generate_changelog_test.sh

      - name: Run release contributors test
        # Stubs the GitHub API, so no token or network is needed here. Guards
        # the two properties the credits depend on: PR numbers resolve from
        # git alone, and no API failure can abort a release.
        run: ./scripts/release/contributors_test.sh

      - name: Run fastlane beta changelog test
        run: ruby scripts/release/fastlane_beta_changelog_test.rb

      - name: Run fastlane submit guard test
        # Guards the App Review submission guard against the defect behind
        # promotion run 31903095751: submitting while a DIFFERENT version was
        # still in review, which renamed the in-review version instead of
        # creating a new one and left it carrying the wrong build.
        run: ruby scripts/release/fastlane_submit_guard_test.rb

      - name: Run App Review notes test
        # Guards the committed App Review notes deliver uploads with every
        # submission: present on both platforms, identical, within Apple's
        # length limit, and free of other-platform names (2.3.10). iOS 1.7.4
        # and 1.7.5 were rejected under 5.1.1(v) because nothing told the
        # reviewer the app has no accounts.
        run: ./scripts/release/app_review_notes_test.sh

      - name: Run pre-push hook test
        # Guards two hook bugs that both rejected pushes for reasons unrelated
        # to the change being pushed: running the checks against the main
        # checkout rather than the worktree, and a set -e abort that produced
        # no error message. Stubs dart/flutter, so no toolchain is needed here.
        run: ./scripts/pre_push_hook_test.sh

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/scripts.xml
          flags: scripts
          fail_ci_if_error: false

  integration-test:
    name: Integration Test (macOS)
    needs: codegen
    runs-on: macos-26
    # This job normally finishes in ~10 min; without a bound a hung UI test
    # (perpetual pumpAndSettle, window focus, platform-channel wait) would hold
    # a macOS runner for GitHub's 6-hour default. Fail fast instead.
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat ${{ env.FLUTTER_VERSION_FILE }})" >> "$GITHUB_OUTPUT"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: subosito/flutter-action@v2
        id: setup-flutter
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: 'stable'

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-flutter.outputs.CACHE-PATH }}
          key: ${{ steps.setup-flutter.outputs.CACHE-KEY }}

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Disable code signing for CI
        run: |
          echo 'CODE_SIGNING_ALLOWED = NO' >> macos/Runner/Configs/Debug.xcconfig
          echo 'CODE_SIGNING_REQUIRED = NO' >> macos/Runner/Configs/Debug.xcconfig
          echo 'CODE_SIGN_IDENTITY = ' >> macos/Runner/Configs/Debug.xcconfig

      - name: Disable Swift Package Manager (project uses CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Download generated code
        uses: actions/download-artifact@v8
        with:
          name: generated-code

      - name: Unpack generated code
        run: tar -xzf generated-code.tar.gz

      - name: Run integration tests
        run: |
          # Run each file in its own `flutter test` process: a single
          # `flutter test integration_test/` invocation relaunches the macOS
          # app once per file, and the second sequential desktop relaunch
          # deterministically fails to attach ("log reader stopped
          # unexpectedly"). One launch per invocation avoids that.
          # nullglob: if the dir has no *_test.dart the loop runs zero times
          # (matching the old "No tests ran" success) instead of passing the
          # literal glob to `flutter test`.
          shopt -s nullglob
          for test in integration_test/*_test.dart; do
            echo "== Running $test =="
            flutter test "$test" \
              -d macos \
              --dart-define=SCREENSHOT_MODE=false
          done

