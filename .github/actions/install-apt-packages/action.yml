name: Install apt packages (bounded, cached)
description: >
  apt-get install with a time limit on the download, retried, and an optional
  cache of the downloaded .deb files. A runner with a slow path to the Ubuntu
  mirror fetched packages at about 50 KB/s and ran the Linux integration job
  into its 25 minute limit twice on run 40535224550, while healthy runners
  finished the same install in 30 seconds (issue #3751). Every workflow step
  that installs apt packages on the runner goes through this action;
  scripts/check_apt_installs_bounded.py enforces that, and that the bound
  below stays in place.

inputs:
  packages:
    description: The apt packages to install, separated by spaces or newlines
    required: true
  cache:
    description: >
      Whether to restore and save the downloaded .deb files. Off unless a job
      opts in: apt reuses a .deb it finds in its archive directory after
      checking only its size, not its hash, so a workflow that builds
      artifacts people download must never turn it on. A small package set
      also gains nothing, since restoring and saving an entry takes longer
      than downloading a few hundred kilobytes.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Each run saves under a key of its own, and the restore takes the newest
    # entry for this Ubuntu release and package list (restore-keys returns
    # the most recently created match). An entry is saved only when the
    # download fetched a .deb the restored set lacked, so a package Ubuntu
    # updates is downloaded once and cached from then on, and a run that
    # fetched nothing saves nothing. ImageOS, set on hosted runners, keeps
    # Ubuntu releases apart. The image's weekly version is left out: runners
    # on two versions of one release need nearly the same packages, and
    # keying on it saved a full copy for each version during a rollout. The
    # package list is part of the key, sorted, so two jobs share an entry
    # exactly when they install the same packages. It also names the
    # directory, so two calls in one job never share one.
    - name: Compute the package cache key
      id: key
      if: inputs.cache == 'true'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        set -f
        # shellcheck disable=SC2086 # split the list into one name per line
        list_hash=$(printf '%s\n' $PACKAGES | sort -u | sha256sum | cut -c1-16)
        prefix="apt-${ImageOS:-unknown}-${list_hash}-"
        {
          echo "prefix=$prefix"
          echo "key=${prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "dir=$RUNNER_TEMP/apt-archives-$list_hash"
        } >> "$GITHUB_OUTPUT"

    # actions/cache abandons a stalled download and continues without the
    # cache only after SEGMENT_DOWNLOAD_TIMEOUT_MINS, 10 minutes by default.
    # A healthy restore takes about 3 seconds, and the mirror download below
    # is bounded anyway, so give up on the cache much sooner.
    - name: Restore downloaded packages
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v6
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    # Only the download is bounded. A time limit around the whole install
    # could kill dpkg half way through unpacking and leave the package
    # database broken for the retry. apt keeps every finished .deb and resumes
    # a partial one, so a killed attempt loses nothing it already fetched, and
    # the retry opens a fresh connection to the mirror. A healthy runner needs
    # about 3 seconds for the update and 10 for a cold download of the
    # largest list here, so the limits leave ten times that.
    #
    # When caching, apt's archive directory is emptied first, so it ends up
    # holding only this call's packages and the cache saved below cannot pick
    # up an earlier call's. A later call in the same job skips its first
    # update, since the lists were fetched minutes ago; a retry always
    # updates. Afterwards the step reports whether apt fetched any .deb that
    # is not identical to a restored one, which is what decides the save.
    - name: Download and install
      id: download
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        ARCHIVE_DIR: ${{ steps.key.outputs.dir }}
      run: |
        set -euo pipefail
        set -f
        # shellcheck disable=SC2206 # split the list on whitespace
        packages=($PACKAGES)
        set +f
        if [ -n "$ARCHIVE_DIR" ]; then
          sudo apt-get clean
          if compgen -G "$ARCHIVE_DIR/*.deb" > /dev/null; then
            sudo cp "$ARCHIVE_DIR"/*.deb /var/cache/apt/archives/
          fi
        fi
        lists_fetched="$RUNNER_TEMP/apt-lists-fetched"
        attempts=3
        update_seconds=60
        download_seconds=120
        for attempt in $(seq 1 "$attempts"); do
          if { [ "$attempt" -eq 1 ] && [ -e "$lists_fetched" ]; } \
            || sudo timeout --kill-after=10 "$update_seconds" apt-get update; then
            touch "$lists_fetched"
            if sudo timeout --kill-after=10 "$download_seconds" \
              apt-get install -y --download-only "${packages[@]}"; then
              break
            fi
          fi
          if [ "$attempt" -eq "$attempts" ]; then
            echo "::error::apt-get update or the package download failed, or ran past its ${update_seconds}s or ${download_seconds}s limit, on all $attempts attempts; apt's own messages above say which"
            exit 1
          fi
          echo "::warning::apt attempt $attempt of $attempts failed or ran out of time; retrying"
          sleep 10
        done
        sudo apt-get install -y --no-download "${packages[@]}"
        if [ -n "$ARCHIVE_DIR" ]; then
          fetched=false
          for deb in /var/cache/apt/archives/*.deb; do
            [ -e "$deb" ] || continue
            if ! cmp -s "$deb" "$ARCHIVE_DIR/${deb##*/}"; then
              fetched=true
              break
            fi
          done
          echo "fetched=$fetched" >> "$GITHUB_OUTPUT"
        fi

    # autoclean drops the .deb files the current package lists no longer
    # offer, so each new entry holds one version of each package instead of
    # every version it has ever seen.
    - name: Collect downloaded packages for the cache
      if: inputs.cache == 'true' && steps.download.outputs.fetched == 'true'
      shell: bash
      env:
        ARCHIVE_DIR: ${{ steps.key.outputs.dir }}
      run: |
        set -euo pipefail
        sudo apt-get autoclean
        rm -rf "$ARCHIVE_DIR"
        mkdir -p "$ARCHIVE_DIR"
        if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
          cp /var/cache/apt/archives/*.deb "$ARCHIVE_DIR"/
        fi

    - name: Save downloaded packages
      if: inputs.cache == 'true' && steps.download.outputs.fetched == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
