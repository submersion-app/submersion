# Automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions -- weekly, security-critical
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"

  # Dart/Flutter pub packages -- weekly
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  # Ruby/Bundler (Fastlane) -- monthly, changes infrequently. Every Gemfile's
  # directory belongs here; scripts/check_dependabot_gemfiles.py fails CI when
  # one is missing (android/ was, #3495).
  - package-ecosystem: "bundler"
    directories:
      - "/ios"
      - "/macos"
      - "/android"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
