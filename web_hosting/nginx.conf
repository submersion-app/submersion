# nginx site for the Submersion web bundle. Drop it into conf.d (the
# Dockerfile beside it does) with the bundle under /usr/share/nginx/html.
#
# The two headers make the page cross-origin isolated, which lets the app
# use the fastest browser storage; without them it still runs, on a slower
# storage path shown in Settings. `credentialless` rather than
# `require-corp` so map tiles and remote photos keep loading. HTTPS is
# terminated in front of this server. See HOSTING.md.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        # A location with its own add_header drops the server's, so the
        # two headers are repeated here.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
