# nginx site for the Submersion web bundle. Drop it into conf.d (the
# Dockerfile beside it does) with the bundle under /usr/share/nginx/html.
#
# The two headers make the page cross-origin isolated, which lets the app
# use the fastest browser storage; without them it still runs, on a slower
# storage path shown in Settings. `credentialless` rather than
# `require-corp` so map tiles and remote photos keep loading. HTTPS is
# terminated in front of this server. See HOSTING.md.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    # A site whose users connect Google Drive needs Google's sign-in popup
    # to talk back to the page, which same-origin forbids; send
    # "same-origin-allow-popups" instead and accept the slower storage.

    gzip on;
    gzip_types text/javascript application/javascript application/wasm application/json text/css;

    # These keep their names across releases, and the app, its workers and
    # the SQLite module must all come from one release, so they are
    # revalidated on every load; the rest may stay cached until they change.
    location ~ ^/(index\.html|flutter_bootstrap\.js|main\.dart\.js|version\.json|drift_worker\.js|compute_worker\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        # A location with its own add_header drops the server's, so the
        # two headers are repeated here.
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
